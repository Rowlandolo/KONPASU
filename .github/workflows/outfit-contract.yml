name: Outfit compatibility contract
on:
  pull_request:
    paths:
      - avatar-outfit-v25.js
      - design/avatar/outfit-contract*
      - scripts/build-outfit-contract-cases.cjs
      - scripts/outfit-browser-check.cjs
      - tests/outfit-adapter.cjs
      - tests/support/outfit-cases.cjs
      - .github/workflows/outfit-contract.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  outfit-contract-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-outfit-contract-cases.cjs
      - run: git diff --exit-code -- design/avatar/outfit-contract-cases-v01.json
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/outfit-browser-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outfit-contract-acceptance
          path: browser-results/outfit-contract/
