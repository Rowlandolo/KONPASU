name: Session outfit draft
on:
  pull_request:
    paths:
      - avatar-outfit-draft-v25.js
      - design/avatar/outfit-draft*
      - scripts/outfit-draft-browser-check.cjs
      - tests/outfit-draft.cjs
      - .github/workflows/outfit-draft.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  outfit-draft-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/outfit-draft-browser-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outfit-draft-acceptance
          path: browser-results/outfit-draft/
