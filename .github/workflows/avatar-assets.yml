name: Build avatar delivery assets
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/build-avatar-delivery.cjs
      - design/avatar/delivery-recipe-v06.json
      - design/avatar/prototype-assets.json
      - design/avatar/equipment/**
      - design/avatar/base-layer*contract.json
      - design/avatar/layers/**
permissions:
  contents: read
jobs:
  delivery-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/build-avatar-delivery.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: avatar-delivery-v06
          path: |
            design/avatar/runtime-v06/
            design/avatar/delivery-assets-v06.json
