name: Personalized main multi-outfit avatar
on:
  pull_request:
    paths:
      - avatar-outfit*.js
      - avatar-composer-v24.js
      - avatar2d.js
      - app.js
      - app.css
      - index.html
      - sw.js
      - version.json
      - scripts/main-avatar-browser-check.cjs
      - tests/main-avatar-outfits.cjs
      - .github/workflows/main-avatar.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  main-avatar-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/main-avatar-browser-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-avatar-acceptance
          path: browser-results/main-avatar/
